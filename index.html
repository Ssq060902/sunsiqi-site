<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>孙思淇 · 个人主页</title>
  <meta name="description" content="孙思淇的个人展示网站 —— 大连民族大学在读。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%2322A869'/%3E%3Ctext x='50' y='70' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E5%AD%99%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#top">
        <span class="brand-mark" id="brandMark">孙</span>
        <span class="brand-name" id="brandName">孙思淇</span>
      </a>
      <nav class="site-nav" id="siteNav" aria-label="主导航">
        <a href="#about">关于我</a>
        <a href="#skills">技能展示</a>
        <a href="#projects">项目展示</a>
        <a href="#contact" class="nav-cta">联系我</a>
      </nav>
      <button class="nav-toggle" id="navToggle" aria-label="打开菜单" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main id="top">
    <!-- Hero -->
    <section class="hero">
      <div class="hero-deco deco-a" aria-hidden="true"></div>
      <div class="hero-deco deco-b" aria-hidden="true"></div>
      <div class="container hero-inner">
        <div class="hero-avatar" aria-hidden="true" id="heroAvatar">孙</div>
        <h1 class="hero-title">你好，我是<span class="accent" id="heroName">孙思淇</span></h1>
        <p class="hero-meta"><span class="chip" id="heroBadge">大连民族大学 · 在读</span></p>
        <p class="hero-desc" id="heroDesc">这是我的个人小站。关于我、我的技能和我做过的项目，都会在这里慢慢记录与生长。</p>
        <div class="hero-actions">
          <a class="btn btn-primary" href="#about">了解我</a>
          <a class="btn btn-ghost" href="#projects">看项目</a>
        </div>
      </div>
    </section>

    <!-- 人物介绍 -->
    <section class="section" id="about">
      <div class="container">
        <p class="section-kicker">About</p>
        <h2 class="section-title">人物介绍</h2>
        <div class="about-grid">
          <div class="about-card profile-card reveal">
            <div class="profile-avatar" aria-hidden="true" id="profileAvatar">孙</div>
            <div class="profile-name" id="profileName">孙思淇</div>
            <div class="profile-school" id="profileBadge">大连民族大学 · 在读</div>
          </div>
        </div>
        <div class="about-extra reveal" id="aboutExtra" hidden></div>
      </div>
    </section>

    <!-- 技能展示 -->
    <section class="section section-alt" id="skills">
      <div class="container">
        <p class="section-kicker">Skills</p>
        <h2 class="section-title">技能展示</h2>
        <div class="empty-card reveal" id="skillsList">
          <div class="empty-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14.7 6.3a4.5 4.5 0 0 0-6.4 6.4l-4.6 4.6a1.5 1.5 0 0 0 0 2.1l1 1a1.5 1.5 0 0 0 2.1 0l4.6-4.6a4.5 4.5 0 0 0 6.4-6.4l-2.4 2.4-2.6-.7-.7-2.6 2.6-2.4z"/>
            </svg>
          </div>
          <h3 class="empty-title">内容整理中</h3>
          <p class="empty-text">正在梳理我的技能清单，之后会在这里展示。敬请期待～</p>
          <div class="empty-skeleton" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
        </div>
      </div>
    </section>

    <!-- 项目展示 -->
    <section class="section" id="projects">
      <div class="container">
        <p class="section-kicker">Projects</p>
        <h2 class="section-title">项目展示</h2>
        <div class="empty-card reveal" id="projectsList">
          <div class="empty-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="14" rx="2"/>
              <path d="M8 21h8M12 18v3M7 9l2 2-2 2M12 13h4"/>
            </svg>
          </div>
          <h3 class="empty-title">内容整理中</h3>
          <p class="empty-text">我的项目正在整理与上传，之后会在这里展示。敬请期待～</p>
          <div class="empty-skeleton" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="contact">
    <div class="container footer-inner">
      <div class="footer-brand">
        <span class="brand-mark" id="footerMark">孙</span> <span id="footerBrandName">孙思淇</span>
      </div>
      <p class="footer-text" id="footerText">大连民族大学 · 在读</p>
      <a class="footer-github" id="footerGithub" href="https://github.com/Ssq060902" target="_blank" rel="noopener">

        <span id="footerGithubText">GitHub @Ssq060902</span>
      </a>
      <p class="footer-copy" id="footerCopy">© 2026 孙思淇 · 用心记录每一步成长</p>
      <a class="footer-admin" href="http://127.0.0.1:8778/admin">管理</a>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
